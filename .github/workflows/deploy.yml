name: Deploy LarkAI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: larkai-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: make check test
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/trident-rm/larkai:sha-${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://dashboard.herkules.dev
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH credentials
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          LARKAI_ENV: ${{ secrets.LARKAI_ENV }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_REDIRECT_URI: ${{ secrets.FEISHU_REDIRECT_URI }}
          FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_SUBMIT_TABLE_ID: ${{ secrets.FEISHU_BITABLE_SUBMIT_TABLE_ID }}
          FEISHU_BITABLE_TASKS_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TASKS_TABLE_ID }}
          FEISHU_ADMIN_OPEN_IDS: ${{ secrets.FEISHU_ADMIN_OPEN_IDS }}
          FEISHU_SCOPES: ${{ secrets.FEISHU_SCOPES }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_opts=(-i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$remote" 'umask 077; mkdir -p ~/larkai/incoming'
          printf 'LARKAI_IMAGE=ghcr.io/trident-rm/larkai@%s\n' "$IMAGE_DIGEST" > image.env
          umask 077
          python3 deploy/runtime_env.py
          trap 'rm -f runtime.env ~/.ssh/deploy' EXIT
          scp "${ssh_opts[@]}" deploy/compose.yml image.env runtime.env "$remote:larkai/incoming/"
          scp "${ssh_opts[@]}" deploy/apply.sh deploy/merge_env.py "$remote:larkai/"
          # Use a disposable registry config; don't overwrite other apps' credentials.
          printf '%s' "$GH_TOKEN" | ssh "${ssh_opts[@]}" "$remote" "umask 077; mkdir -p ~/larkai/.docker; docker --config ~/larkai/.docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh "${ssh_opts[@]}" "$remote" 'export DOCKER_CONFIG="$HOME/larkai/.docker"; trap '\''rm -rf "$DOCKER_CONFIG"'\'' EXIT; bash ~/larkai/apply.sh'
      - name: Verify authentication redirect
        run: |
          curl -sS --max-time 30 -D headers -o /dev/null https://dashboard.herkules.dev/
          grep -qiE '^location: (/oidc/login|https://hxyulin.cloudflareaccess.com/)' headers
